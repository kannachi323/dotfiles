# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Gruvbox Dark
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0
# END_KITTY_FONTS
enabled_layouts splits,stack
disable_ligatures always

shell_integration no-cursor
cursor_shape block
cursor_blink_interval 0.4
allow_remote_control yes
listen_on unix:/tmp/mykitty

map ctrl+/>s goto_session /home/kannachi/.config/kitty/sessions/ 
tab_bar_min_tabs 1
tab_title_template "{index}: {title} {fmt.fg.white}{layout_name[:1].upper()}"
window_margin_width 2

map ctrl+shift+l no_op
map alt+shift+x close_window
map alt+shift+z toggle_layout stack
map alt+shift+n launch --location=vsplit --cwd=current
map alt+shift+b launch --location=hsplit --cwd=current
map alt+shift+h neighboring_window left
map alt+shift+j neighboring_window down
map alt+shift+k neighboring_window up
map alt+shift+l neighboring_window right
map alt+shift+t new_tab_with_cwd
map alt+shift+w close_tab
map alt+shift+1 goto_tab 1
map alt+shift+2 goto_tab 2
map alt+shift+3 goto_tab 3
map alt+shift+4 goto_tab 4
map alt+shift+5 goto_tab 5
map alt+shift+6 goto_tab 6
map alt+shift+7 goto_tab 7
map alt+shift+8 goto_tab 8
map alt+shift+9 goto_tab 9
map alt+shift+, previous_tab
map alt+shift+. next_tab
